<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC-05: Trading - BrokerX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        .navbar {
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .nav-link {
            text-decoration: none;
            color: #11998e;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }
        .nav-link:hover {
            color: #0d7a6f;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .account-balance {
            background: #f0f9f7;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 600;
            color: #11998e;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .panel {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .panel h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #11998e;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #11998e;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-buy {
            background: #28a745;
            color: white;
        }
        .btn-buy:hover {
            background: #218838;
        }
        .btn-sell {
            background: #dc3545;
            color: white;
        }
        .btn-sell:hover {
            background: #c82333;
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .alert.show {
            display: block;
            animation: slideIn 0.3s;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .order-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #11998e;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .order-symbol {
            font-size: 1.2rem;
            font-weight: 700;
            color: #11998e;
        }
        .order-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .order-status.working {
            background: #fff3cd;
            color: #856404;
        }
        .order-status.filled {
            background: #d4edda;
            color: #155724;
        }
        .order-status.cancelled {
            background: #f8d7da;
            color: #721c24;
        }
        .order-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            font-size: 0.9rem;
            color: #666;
        }
        .order-detail {
            display: flex;
            flex-direction: column;
        }
        .order-detail-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 2px;
        }
        .order-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
        }
        .btn-cancel {
            background: #dc3545;
            color: white;
            border: none;
            cursor: pointer;
        }
        .btn-cancel:hover {
            background: #c82333;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .market-price {
            background: #e7f9f3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        .market-price-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #11998e;
        }
        .market-price-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
        }
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .symbol-chip {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        .symbol-chip:hover {
            border-color: #11998e;
            background: #e7f9f3;
        }
        .symbol-chip.active {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }
        .order-item {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .order-symbol {
            font-weight: 700;
            font-size: 1.1rem;
            color: #333;
        }
        .order-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .status-new {
            background: #d4edda;
            color: #155724;
        }
        .status-partiallyfilled {
            background: #fff3cd;
            color: #856404;
        }
        .status-filled {
            background: #d1ecf1;
            color: #0c5460;
        }
        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }
        .status-rejected {
            background: #f5c6cb;
            color: #721c24;
        }
        .order-details {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.6;
        }
        .order-time {
            font-size: 0.85rem;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation Bar -->
        <div class="navbar">
            <a href="/dashboard.html" class="nav-link">
                <span style="font-size: 1.2rem;">←</span> Dashboard
            </a>
            <div class="user-info">
                <div class="account-balance" id="accountBalance">
                    💰 $0.00
                </div>
                <span id="userEmail" style="color: #666;">👤 User</span>
                <a href="/signin.html" onclick="localStorage.removeItem('authToken')" class="nav-link" style="color: #dc3545;">
                    🚪 Logout
                </a>
            </div>
        </div>

        <h1>💹 Trading Platform (UC-05)</h1>

        <!-- Alert Messages -->
        <div id="alertSuccess" class="alert success"></div>
        <div id="alertError" class="alert error"></div>

        <div class="dashboard-grid">
            <!-- Place Order Form -->
            <div class="panel">
                <h2>�� Place Order</h2>

                <!-- Quick Symbol Selection -->
                <div class="quick-actions">
                    <div class="symbol-chip" data-symbol="AAPL">AAPL</div>
                    <div class="symbol-chip" data-symbol="TSLA">TSLA</div>
                    <div class="symbol-chip" data-symbol="GOOGL">GOOGL</div>
                    <div class="symbol-chip" data-symbol="AMZN">AMZN</div>
                    <div class="symbol-chip" data-symbol="MSFT">MSFT</div>
                </div>

                <!-- Market Price Display -->
                <div class="market-price" id="marketPriceDisplay" style="display: none;">
                    <div class="market-price-label">Current Market Price</div>
                    <div class="market-price-value" id="marketPriceValue">$0.00</div>
                    <div style="font-size: 0.75rem; color: #999; margin-top: 5px;">
                        Last updated: <span id="marketPriceTime">--:--</span>
                    </div>
                </div>

                <form id="orderForm">
                    <div class="form-group">
                        <label for="symbol">Symbol *</label>
                        <input type="text" id="symbol" required placeholder="e.g., AAPL" style="text-transform: uppercase;">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="side">Side *</label>
                            <select id="side" required>
                                <option value="Buy">Buy</option>
                                <option value="Sell">Sell</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="type">Type *</label>
                            <select id="type" required>
                                <option value="Market">Market</option>
                                <option value="Limit">Limit</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="quantity">Quantity *</label>
                            <input type="number" id="quantity" required min="1" placeholder="100">
                        </div>
                        <div class="form-group" id="priceGroup" style="display: none;">
                            <label for="price">Limit Price *</label>
                            <input type="number" id="price" step="0.01" placeholder="195.50">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="timeInForce">Time in Force</label>
                        <select id="timeInForce">
                            <option value="DAY" selected>DAY (Day Order)</option>
                            <option value="GTC">GTC (Good Till Cancel)</option>
                            <option value="IOC">IOC (Immediate or Cancel)</option>
                            <option value="FOK">FOK (Fill or Kill)</option>
                        </select>
                    </div>

                    <div id="orderEstimate" style="background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none;">
                        <div style="font-weight: 600; color: #333; margin-bottom: 5px;">Estimated Cost</div>
                        <div style="font-size: 1.5rem; font-weight: 700; color: #11998e;" id="estimatedCost">$0.00</div>
                    </div>

                    <button type="submit" id="buyBtn" class="btn btn-buy" style="display: none;">
                        🟢 Place Buy Order
                    </button>
                    <button type="submit" id="sellBtn" class="btn btn-sell" style="display: none;">
                        🔴 Place Sell Order
                    </button>
                </form>
            </div>

            <!-- Active Orders -->
            <div class="panel">
                <h2>📋 My Orders</h2>
                <div id="ordersList">
                    <div class="empty-state">
                        <p>No orders yet</p>
                        <p style="font-size: 0.85rem; margin-top: 10px;">Place your first order to get started!</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Order History -->
        <div class="panel">
            <h2>📜 Order History</h2>
            <div id="orderHistory">
                <div class="empty-state">
                    <p>No order history</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = 'http://localhost:8080/api/v1';
        let accountId = null;
        let currentSymbol = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // Check auth
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = '/signin.html';
                return;
            }

            // Get account info from localStorage or fetch
            accountId = localStorage.getItem('accountId');
            const userEmail = localStorage.getItem('userEmail');
            if (userEmail) {
                document.getElementById('userEmail').textContent = '👤 ' + userEmail;
            }

            if (!accountId) {
                showError('Account ID not found. Please deposit funds first.');
                setTimeout(() => window.location.href = '/dashboard.html', 2000);
                return;
            }

            // Load account balance
            await loadAccountBalance();

            // Load orders
            await loadOrders();

            // Setup event listeners
            setupEventListeners();
        });

        function setupEventListeners() {
            // Symbol chips
            document.querySelectorAll('.symbol-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    document.querySelectorAll('.symbol-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    currentSymbol = chip.dataset.symbol;
                    document.getElementById('symbol').value = currentSymbol;
                    loadMarketPrice(currentSymbol);
                });
            });

            // Symbol input
            document.getElementById('symbol').addEventListener('input', (e) => {
                const symbol = e.target.value.toUpperCase();
                e.target.value = symbol;
                if (symbol.length >= 3) {
                    loadMarketPrice(symbol);
                }
            });

            // Type change (Market/Limit)
            document.getElementById('type').addEventListener('change', (e) => {
                const priceGroup = document.getElementById('priceGroup');
                const priceInput = document.getElementById('price');
                if (e.target.value === 'Limit') {
                    priceGroup.style.display = 'block';
                    priceInput.required = true;
                } else {
                    priceGroup.style.display = 'none';
                    priceInput.required = false;
                }
                updateEstimate();
            });

            // Side change (Buy/Sell)
            document.getElementById('side').addEventListener('change', updateButtonDisplay);

            // Quantity/Price change
            document.getElementById('quantity').addEventListener('input', updateEstimate);
            document.getElementById('price').addEventListener('input', updateEstimate);

            // Form submit
            document.getElementById('orderForm').addEventListener('submit', handleOrderSubmit);

            // Initial button display
            updateButtonDisplay();
        }

        function updateButtonDisplay() {
            const side = document.getElementById('side').value;
            const buyBtn = document.getElementById('buyBtn');
            const sellBtn = document.getElementById('sellBtn');
            
            if (side === 'Buy') {
                buyBtn.style.display = 'block';
                sellBtn.style.display = 'none';
            } else {
                buyBtn.style.display = 'none';
                sellBtn.style.display = 'block';
            }
        }

        async function loadMarketPrice(symbol) {
            // Simulate fetching market price from UC-04 endpoint
            // In reality, this would connect to your market data service
            const simulatedPrices = {
                'AAPL': 195.50,
                'TSLA': 242.80,
                'GOOGL': 142.30,
                'AMZN': 178.90,
                'MSFT': 425.10
            };

            const price = simulatedPrices[symbol] || 100.00;
            document.getElementById('marketPriceValue').textContent = '$' + price.toFixed(2);
            document.getElementById('marketPriceTime').textContent = new Date().toLocaleTimeString();
            document.getElementById('marketPriceDisplay').style.display = 'block';
            
            updateEstimate();
        }

        function updateEstimate() {
            const type = document.getElementById('type').value;
            const quantity = parseFloat(document.getElementById('quantity').value) || 0;
            const price = parseFloat(document.getElementById('price').value) || 0;
            const marketPrice = parseFloat(document.getElementById('marketPriceValue').textContent.replace('$', '')) || 0;

            let estimatedCost = 0;
            if (type === 'Market' && marketPrice > 0) {
                estimatedCost = quantity * marketPrice;
            } else if (type === 'Limit' && price > 0) {
                estimatedCost = quantity * price;
            }

            if (estimatedCost > 0) {
                document.getElementById('estimatedCost').textContent = '$' + estimatedCost.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                document.getElementById('orderEstimate').style.display = 'block';
            } else {
                document.getElementById('orderEstimate').style.display = 'none';
            }
        }

        async function loadAccountBalance() {
            try {
                // Simulate fetching account balance
                // In reality, this would be from your portfolio/wallet service
                const balance = parseFloat(localStorage.getItem('accountBalance')) || 50000.00;
                document.getElementById('accountBalance').textContent = '💰 $' + balance.toLocaleString('en-US', {minimumFractionDigits: 2});
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }

        async function handleOrderSubmit(e) {
            e.preventDefault();

            const symbol = document.getElementById('symbol').value.trim().toUpperCase();
            const side = document.getElementById('side').value;
            const type = document.getElementById('type').value;
            const quantity = parseInt(document.getElementById('quantity').value);
            const price = type === 'Limit' ? parseFloat(document.getElementById('price').value) : null;
            const timeInForce = document.getElementById('timeInForce').value;

            // Generate unique client order ID
            const clientOrderId = `ORD-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;

            const orderData = {
                clientOrderId,
                symbol,
                side,
                type,
                quantity,
                price,
                timeInForce
            };

            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch(`${API_BASE}/orders/${accountId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(orderData)
                });

                const result = await response.json();

                if (response.ok) {
                    showSuccess(`Order placed successfully! Order ID: ${result.orderId.substring(0, 8)}...`);
                    document.getElementById('orderForm').reset();
                    updateButtonDisplay();
                    await loadOrders();
                } else {
                    showError(result.message || 'Failed to place order');
                }
            } catch (error) {
                console.error('Error placing order:', error);
                showError('Network error. Please try again.');
            }
        }

        async function loadOrders() {
            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch(`${API_BASE}/orders/${accountId}/orders`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch orders');
                }

                const orders = await response.json();
                const ordersList = document.getElementById('ordersList');
                
                // Filtrer les ordres actifs (pas Filled, Cancelled, Rejected, Expired)
                const activeOrders = orders.filter(o => 
                    !['Filled', 'Cancelled', 'Rejected', 'Expired'].includes(o.status)
                );

                if (activeOrders.length === 0) {
                    ordersList.innerHTML = `
                        <div class="empty-state">
                            <p>No active orders</p>
                        </div>
                    `;
                    return;
                }

                ordersList.innerHTML = activeOrders.map(order => `
                    <div class="order-item">
                        <div class="order-header">
                            <span class="order-symbol">${order.symbol}</span>
                            <span class="order-status status-${order.status.toLowerCase()}">${order.status}</span>
                        </div>
                        <div class="order-details">
                            <div><strong>${order.side}</strong> ${order.quantity} @ ${order.type === 'Market' ? 'Market' : '$' + order.price?.toFixed(2)}</div>
                            <div>Order ID: ${order.orderId.substring(0, 8)}...</div>
                            <div>Filled: ${order.filledQuantity || 0} / ${order.quantity}</div>
                        </div>
                        <button onclick="cancelOrder('${order.orderId}')" class="btn-cancel">Cancel</button>
                    </div>
                `).join('');

                // Charger aussi l'historique
                await loadOrderHistory(orders.filter(o => 
                    ['Filled', 'Cancelled', 'Rejected', 'Expired'].includes(o.status)
                ));

            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('ordersList').innerHTML = `
                    <div class="empty-state">
                        <p style="color: #e74c3c;">Failed to load orders</p>
                    </div>
                `;
            }
        }

        async function loadOrderHistory(completedOrders) {
            const historyList = document.getElementById('historyList');
            
            if (completedOrders.length === 0) {
                historyList.innerHTML = `
                    <div class="empty-state">
                        <p>No order history</p>
                    </div>
                `;
                return;
            }

            historyList.innerHTML = completedOrders.slice(0, 10).map(order => `
                <div class="order-item">
                    <div class="order-header">
                        <span class="order-symbol">${order.symbol}</span>
                        <span class="order-status status-${order.status.toLowerCase()}">${order.status}</span>
                    </div>
                    <div class="order-details">
                        <div><strong>${order.side}</strong> ${order.quantity} @ ${order.type === 'Market' ? 'Market' : '$' + order.price?.toFixed(2)}</div>
                        <div>Filled: ${order.filledQuantity || 0} @ ${order.avgPrice ? '$' + order.avgPrice.toFixed(2) : 'N/A'}</div>
                        <div class="order-time">${new Date(order.createdAt).toLocaleString()}</div>
                    </div>
                </div>
            `).join('');
        }

        async function cancelOrder(orderId) {
            if (!confirm('Are you sure you want to cancel this order?')) return;

            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch(`${API_BASE}/orders/${accountId}/orders/${orderId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    showSuccess('Order cancelled successfully');
                    await loadOrders();
                } else {
                    const result = await response.json();
                    showError(result.message || 'Failed to cancel order');
                }
            } catch (error) {
                console.error('Error cancelling order:', error);
                showError('Network error. Please try again.');
            }
        }

        function showSuccess(message) {
            const alert = document.getElementById('alertSuccess');
            alert.textContent = '✅ ' + message;
            alert.classList.add('show');
            setTimeout(() => alert.classList.remove('show'), 5000);
        }

        function showError(message) {
            const alert = document.getElementById('alertError');
            alert.textContent = '❌ ' + message;
            alert.classList.add('show');
            setTimeout(() => alert.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
