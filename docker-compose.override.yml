version: '3.8'

services:
  # Créer N instances API
  brokerx-api-1:
    image: ${DOCKER_REGISTRY-}brokerx-api
    container_name: brokerx-api-1
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=brokerx;User=root;Password=root123;
      - INSTANCE_NAME=api-1
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - brokerx-network
    volumes:
      - ./Infrastructure.Web/logs:/app/logs

  brokerx-api-2:
    image: ${DOCKER_REGISTRY-}brokerx-api
    container_name: brokerx-api-2
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=brokerx;User=root;Password=root123;
      - INSTANCE_NAME=api-2
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - brokerx-network
    volumes:
      - ./Infrastructure.Web/logs:/app/logs

  brokerx-api-3:
    image: ${DOCKER_REGISTRY-}brokerx-api
    container_name: brokerx-api-3
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=brokerx;User=root;Password=root123;
      - INSTANCE_NAME=api-3
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - brokerx-network
    volumes:
      - ./Infrastructure.Web/logs:/app/logs

  brokerx-api-4:
    image: ${DOCKER_REGISTRY-}brokerx-api
    container_name: brokerx-api-4
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=brokerx;User=root;Password=root123;
      - INSTANCE_NAME=api-4
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - brokerx-network
    volumes:
      - ./Infrastructure.Web/logs:/app/logs

  nginx:
    image: nginx:alpine
    container_name: brokerx-nginx
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - brokerx-api-1
      - brokerx-api-2
      - brokerx-api-3
      - brokerx-api-4
    networks:
      - brokerx-network

networks:
  brokerx-network:
    driver: bridge
